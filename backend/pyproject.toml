[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-stock-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "duckdb>=1.2,<2",
  "pandas>=2.2,<3", "numpy>=2,<3", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "akshare>=1.16,<2", "requests>=2.32,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
"app.database" = ["schema.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
